name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Third-party notices are up to date
        run: npm run notices:check
      - name: Python lint (Blender / Unreal / Kimodo scripts)
        run: |
          pip install ruff
          ruff check resources
      - run: npx electron-vite build
